version: "3.8"

services:
  backend:
    build: .
    image: mas-backend:latest
    working_dir: /app
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.github_push_simple:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - PUSH_API_KEY=${PUSH_API_KEY}

  static:
    image: nginx:stable-alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

# Notes:
# - Set GITHUB_TOKEN and PUSH_API_KEY in your shell or a .env file before running:
#   export GITHUB_TOKEN="ghp_..."
#   export PUSH_API_KEY="your-secret"
